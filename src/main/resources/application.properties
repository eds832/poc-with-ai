spring.application.name=demo

# ---- AI Proxy (EPAM) ----
# All values come from environment variables; there is no hardcoded host.
# AI_PROXY_BASE_URL is required - the app fails fast on startup if it is not set.
ai-proxy.base-url=${AI_PROXY_BASE_URL:}
ai-proxy.deployment=${AI_PROXY_DEPLOYMENT:anthropic.claude-v3-haiku}
ai-proxy.api-key=${AI_PROXY_API_KEY:}
ai-proxy.timeout=${AI_PROXY_TIMEOUT:60s}

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:dentalclinic;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# schema.sql and data.sql at app start
spring.sql.init.mode=always
